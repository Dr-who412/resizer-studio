name: Deploy to Firebase Hosting on Merge

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Verify Firebase Service Account Secret
        if: ${{ !(secrets.FIREBASE_SERVICE_ACCOUNT_RESIZE_STUDIO_20E56 || secrets.FIREBASE_SERVICE_ACCOUNT) }}
        run: |
          echo "::error title=Missing Secret::Secret FIREBASE_SERVICE_ACCOUNT_RESIZE_STUDIO_20E56 is not set in GitHub repository secrets. Go to Settings -> Secrets and variables -> Actions -> New repository secret"
          exit 1

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RESIZE_STUDIO_20E56 || secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: resize-studio-20e56
          target: resizer-studio
